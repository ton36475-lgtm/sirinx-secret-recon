# SIRINX / GhostClaw - Secret Scanning Workflow (Defensive)
# Place this in .github/workflows/secret-scan.yml of owned repositories
# Enable secret scanning + push protection in repo settings as well

name: Redteam Secret Recon Scan

on:
  push:
    branches: [main, master, develop, staging/**]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better detection

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # optional for enterprise
        with:
          # Use custom config if present
          config-path: .gitleaks.toml

      - name: Upload SARIF (if findings)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
        continue-on-error: true

  notify-ghostclaw:
    name: Notify GhostClaw / Dashboard on Critical
    needs: gitleaks
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create Issue for Remediation
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[SECRET-RECON] Potential secret findings detected on ${context.ref}`;
            const body = `
            ## Defensive Secret Recon Alert
            - Repository: ${context.repo.owner}/${context.repo.repo}
            - Ref: ${context.ref}
            - Workflow: ${context.workflow}
            - Run: ${context.runId}

            **Action required (per SIRINX policy):**
            1. Review findings in Security > Secret scanning or Actions logs
            2. Classify via L2 Analysis Agent (true positive / false positive)
            3. For Critical: human approval gate before any rotation
            4. Create remediation PR (remove from history if needed, update .gitignore, pre-commit)
            5. Re-scan to confirm clean

            Never store or log raw secret values.
            Scope: own assets only.
            `;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['security', 'secret-recon', 'priority:high']
            });
