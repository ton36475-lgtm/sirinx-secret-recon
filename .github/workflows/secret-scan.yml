# SIRINX / GhostClaw - Secret Scanning Workflow (Defensive)
# Place this in .github/workflows/secret-scan.yml of owned repositories
# Enable secret scanning + push protection in repo settings as well

name: Redteam Secret Recon Scan

on:
  push:
    branches: [main, master, develop, staging/**]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    # A job-level `if:` on the notify job can only read needs.<job>.outputs, never
    # steps.* of an upstream job. Referencing steps.scan.outputs there is an
    # invalid expression: the run is created, then dies with 0 jobs and no log.
    outputs:
      leaks: ${{ steps.scan.outputs.leaks }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better detection

      - name: Run Gitleaks (report + gate)
        id: scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks
          set +e
          gitleaks git . --redact --config .gitleaks.toml --exit-code 2 \
            --report-format sarif --report-path results.sarif \
            --report-format json  --report-path gitleaks-report.json \
            --log-level warn
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "leaks=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 2 ]; then
            echo "leaks=true" >> "$GITHUB_OUTPUT"
            echo "::error::gitleaks found secrets (values redacted)"
            exit 1
          else
            echo "::error::gitleaks failed with exit $code"
            exit "$code"
          fi

      - name: Upload SARIF (if findings)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
        continue-on-error: true

      # `actions: read` is REQUIRED: declaring `permissions:` sets every unlisted
      # scope to none, which kills the run before any job is created on a
      # non-default branch (0 jobs, no log, not retryable).
      - name: Upload scan report for the notify job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: error
          retention-days: 1

  notify-ghostclaw:
    name: Notify GhostClaw / Dashboard on Critical
    needs: gitleaks
    if: failure() && needs.gitleaks.outputs.leaks == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Checkout (for the policy scripts)
        uses: actions/checkout@v4

      # Each job gets its own runner.temp, so a report written by the scan job
      # is NOT visible here. Pass it across explicitly.
      - name: Download scan report
        uses: actions/download-artifact@v4
        with:
          name: gitleaks-report
          path: .

      - name: Decide create vs comment
        env:
          GITLEAKS_REPORT: gitleaks-report.json
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/notify.mjs
